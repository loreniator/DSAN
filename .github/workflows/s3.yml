name: Copia a S3
on:
  push:
    branches: [ main ]
jobs:
  deploy-s3:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ""
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Copiar los archivos al bucket
        run: |
          aws s3 sync ./prac1cicd/ s3://${{ secrets.S3_BUCKET }} --delete

      - name: Mostrar el contenido del bucket
        run: aws s3 ls s3://${{ secrets.S3_BUCKET }} --recursive